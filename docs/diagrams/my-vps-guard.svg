<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
  <title id="title">My VPS Guard</title>
  <desc id="desc">Defense-only path: ingest access events, label Attempt versus Visitor, block only explicit Visitor rows, then sync UFW in about one minute. Attempts are logged, not auto-banned. Diagrammatic panel uses placeholders, not real IPs or hostnames.</desc>
  <rect width="880" height="480" rx="16" fill="#0F172A"/>
  <text x="28" y="36" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CASE STUDY / MY VPS GUARD</text>
  <text x="28" y="60" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650">Ingest - label - Visitor block - UFW sync</text>
  <rect x="708" y="24" width="144" height="44" rx="8" fill="#134E4A" stroke="#2DD4BF"/>
  <text x="780" y="42" text-anchor="middle" fill="#5EEAD4" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">DEFENSE ONLY</text>
  <text x="780" y="58" text-anchor="middle" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">~1 min sync loop</text>
  <defs>
    <marker id="ao-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748B"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="28" y="92" width="168" height="84" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="112" y="122" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">01  INGEST</text>
    <text x="112" y="144" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">auth / access events</text>
    <text x="112" y="162" text-anchor="middle" fill="#64748B" font-size="11">raw line != decision</text>
    <path d="M196 134h20" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="216" y="88" width="188" height="92" rx="12" fill="#1E293B" stroke="#0F766E" stroke-width="1.5"/>
    <text x="310" y="118" text-anchor="middle" fill="#5EEAD4" font-size="10" font-weight="700" letter-spacing="1.1">02  LABEL</text>
    <text x="310" y="140" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">Attempt or Visitor</text>
    <text x="310" y="160" text-anchor="middle" fill="#64748B" font-size="11">evidence, not an action</text>
    <path d="M404 134h20" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="424" y="84" width="204" height="100" rx="12" fill="#134E4A" stroke="#2DD4BF" stroke-width="2"/>
    <text x="526" y="118" text-anchor="middle" fill="#5EEAD4" font-size="10" font-weight="700" letter-spacing="1.1">03  VISITOR BLOCK</text>
    <text x="526" y="140" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">explicit only</text>
    <text x="526" y="160" text-anchor="middle" fill="#99F6E4" font-size="11">human or written rule</text>
    <path d="M628 134h20" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="648" y="88" width="204" height="92" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="750" y="118" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">04  UFW SYNC</text>
    <text x="750" y="140" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">gated write</text>
    <text x="750" y="160" text-anchor="middle" fill="#64748B" font-size="11">~1 min once warm</text>
  </g>
  <rect x="28" y="204" width="404" height="100" rx="12" fill="#1C1917" stroke="#D97706" stroke-width="1.5"/>
  <text x="48" y="236" fill="#FBBF24" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ATTEMPT</text>
  <text x="48" y="260" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Log it. Do not auto-ban.</text>
  <text x="48" y="282" fill="#A8A29E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Noisy probes stay visible without firewall churn.</text>
  <rect x="448" y="204" width="404" height="100" rx="12" fill="#134E4A" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="468" y="236" fill="#5EEAD4" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">VISITOR</text>
  <text x="468" y="260" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Candidate to block - only when labeled.</text>
  <text x="468" y="282" fill="#99F6E4" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Sync is reversible. Rollback sits next to the rule.</text>
  <rect x="28" y="320" width="824" height="136" rx="12" fill="#111827" stroke="#334155"/>
  <text x="48" y="344" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">OPERATOR PANEL / PLACEHOLDERS, NOT A REAL HOST</text>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <text x="64" y="368" fill="#64748B">label</text>
    <text x="220" y="368" fill="#64748B">subject</text>
    <text x="420" y="368" fill="#64748B">action</text>
    <text x="640" y="368" fill="#64748B">ufw</text>
    <rect x="48" y="376" width="784" height="28" rx="6" fill="#0F172A"/>
    <text x="64" y="395" fill="#FBBF24">Attempt</text>
    <text x="220" y="395" fill="#E2E8F0">probe-row</text>
    <text x="420" y="395" fill="#94A3B8">log only</text>
    <text x="640" y="395" fill="#64748B">no change</text>
    <rect x="48" y="408" width="784" height="28" rx="6" fill="#134E4A"/>
    <text x="64" y="427" fill="#5EEAD4">Visitor</text>
    <text x="220" y="427" fill="#E2E8F0">visitor-01</text>
    <text x="420" y="427" fill="#E2E8F0">explicit block</text>
    <text x="640" y="427" fill="#99F6E4">sync (~1 min)</text>
  </g>
</svg>
