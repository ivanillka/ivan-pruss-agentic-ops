<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc">
  <title id="title">Deploy Assistant</title>
  <desc id="desc">Secret-free sample of the gated deploy contract: pre-flight, CI gates with SKIP only when a reason is written, smoke, human GO or NO-GO, timestamped audit report. No SSH, no env values, no cloud APIs.</desc>
  <rect width="880" height="440" rx="16" fill="#0F172A"/>
  <text x="28" y="36" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CASE STUDY / DEPLOY ASSISTANT</text>
  <text x="28" y="60" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650">Operator contract, secret-free sample</text>
  <rect x="692" y="24" width="160" height="44" rx="8" fill="#134E4A" stroke="#2DD4BF"/>
  <text x="772" y="42" text-anchor="middle" fill="#5EEAD4" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">SAMPLE</text>
  <text x="772" y="58" text-anchor="middle" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">no remote mutation</text>
  <defs>
    <marker id="ao-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748B"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="28" y="88" width="132" height="80" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="94" y="118" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">PRE-FLIGHT</text>
    <text x="94" y="140" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">SHA / branch</text>
    <text x="94" y="158" text-anchor="middle" fill="#64748B" font-size="11">missing git = NO-GO</text>
    <path d="M160 128h16" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="176" y="80" width="200" height="96" rx="12" fill="#1E293B" stroke="#0F766E" stroke-width="1.5"/>
    <text x="276" y="106" text-anchor="middle" fill="#5EEAD4" font-size="10" font-weight="700" letter-spacing="1.1">CI GATES</text>
    <text x="276" y="128" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">lint / types / tests</text>
    <text x="276" y="146" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">Playwright / build</text>
    <text x="276" y="164" text-anchor="middle" fill="#64748B" font-size="11">SKIP only with a reason</text>
    <path d="M376 128h16" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="392" y="88" width="112" height="80" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="448" y="118" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">SMOKE</text>
    <text x="448" y="140" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">required files</text>
    <text x="448" y="158" text-anchor="middle" fill="#64748B" font-size="11">no private host</text>
    <path d="M504 128h16" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="520" y="84" width="132" height="88" rx="12" fill="#134E4A" stroke="#2DD4BF" stroke-width="2"/>
    <text x="586" y="118" text-anchor="middle" fill="#5EEAD4" font-size="10" font-weight="700" letter-spacing="1.1">GO / NO-GO</text>
    <text x="586" y="140" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">human records it</text>
    <text x="586" y="158" text-anchor="middle" fill="#99F6E4" font-size="11">FAIL anywhere = stop</text>
    <path d="M652 128h16" stroke="#64748B" stroke-width="2" marker-end="url(#ao-arrow)"/>
    <rect x="668" y="88" width="184" height="80" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="760" y="118" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">AUDIT REPORT</text>
    <text x="760" y="140" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">timestamp + SHA</text>
    <text x="760" y="158" text-anchor="middle" fill="#64748B" font-size="11">gitignored reports/</text>
  </g>
  <path d="M586 172v28" stroke="#D97706" stroke-width="1.5"/>
  <rect x="28" y="212" width="824" height="92" rx="12" fill="#1C1917" stroke="#D97706" stroke-width="1.5"/>
  <text x="48" y="244" fill="#FBBF24" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">THIS SAMPLE WILL NOT</text>
  <text x="48" y="270" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">SSH, read .env values, call cloud APIs, or swallow a red gate with || true.</text>
  <text x="48" y="290" fill="#A8A29E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Rollback text sits next to the SHA. There is no remote mutation to undo.</text>
  <rect x="28" y="320" width="404" height="96" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="48" y="352" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">RUN IN THIS REPO</text>
  <text x="48" y="376" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">./deploy-assistant/run.sh</text>
  <text x="48" y="396" fill="#64748B" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Missing toolchain = SKIP with a reason</text>
  <rect x="448" y="320" width="404" height="96" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="468" y="352" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">PRODUCTION SIBLING</text>
  <text x="468" y="376" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Fotium release path requires every gate</text>
  <text x="468" y="396" fill="#64748B" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">This sample is the inspectable contract</text>
</svg>
